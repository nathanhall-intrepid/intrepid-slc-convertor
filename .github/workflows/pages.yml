name: Deploy Layer Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job receives only its explicitly listed permissions.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare static app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out app
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false

      # dist is the complete static app. No package install or build is needed.
      - name: Verify static entry points
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/worker.js
          test -f dist/vendor/three.module.js

      - name: Upload app files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish app
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
